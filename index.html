<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Einwandtraining pausiert</title>
<style>
  :root { --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5b6475; --accent:#0a5aa8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151b; --card:#1b2029; --text:#e8ebf0; --muted:#a3abb9; --accent:#6aa9ec; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         padding:16px; background:var(--bg); color:var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height:1.5; }
  main { max-width:480px; width:100%; background:var(--card); border-radius:16px; padding:32px 24px;
         box-shadow:0 2px 12px rgba(0,0,0,.08); text-align:center; }
  .icon { font-size:44px; line-height:1; margin-bottom:12px; color:var(--accent); }
  h1 { font-size:1.5rem; margin:0 0 12px; }
  p { margin:0 0 8px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">⏸</div>
  <h1>Das Einwandtraining ist pausiert</h1>
  <p>Gespräche mit den KI-Kunden sind im Moment nicht möglich.</p>
  <p>Sobald das Training wieder freigeschaltet ist, findest du es wie gewohnt unter dieser Adresse.</p>
</main>
</body>
</html>
